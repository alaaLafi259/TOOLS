<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة المعلومات - نظام إدارة العدة</title>
<link rel="stylesheet" href="css/style.css?v=2.1.0">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">🧰 نظام إدارة العدة</div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="side-link active">📊 لوحة المعلومات</a>
      <a href="admin.html" class="side-link">⚙️ إدارة النظام (الأصناف / المواقع / الحركات)</a>
    </nav>
    <div class="sidebar-footer">
      <button class="side-link" onclick="logoutUser()">🚪 خروج</button>
    </div>
  </aside>

  <main class="main-area">
    <div class="topbar">
      <h1>لوحة المعلومات</h1>
      <div class="topbar-actions">
        <button id="themeToggleBtn" class="theme-toggle" onclick="toggleAppTheme()"></button>
      </div>
    </div>

    <div class="container">

      <h2 class="section-title">نظرة عامة</h2>
      <div class="stat-row" id="overviewStats"></div>

      <h2 class="section-title">حالة العدة على مستوى الشركة كلها</h2>
      <div class="stat-row" id="statusStats"></div>

      <div class="card">
        <h2>عدد القطع في كل موقع</h2>
        <div id="siteBarChart"></div>
      </div>

      <div class="card">
        <h2>قيمة العدة في كل موقع</h2>
        <div id="siteValueBarChart"></div>
      </div>

      <div class="card">
        <h2>أكثر 5 أصناف من حيث عدد القطع</h2>
        <table>
          <thead><tr><th>الصنف</th><th>الإجمالي</th><th>المخزن المركزي</th><th>بالمواقع</th></tr></thead>
          <tbody id="topCategoriesTable"></tbody>
        </table>
      </div>

      <div class="card" style="text-align:center;">
        <a href="admin.html" style="text-decoration:none;"><button style="width:auto; padding:12px 30px;">⚙️ الانتقال لإدارة الأصناف والحركات والتقارير التفصيلية</button></a>
      </div>

    </div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js?v=2.1.0"></script>
<script src="js/version.js?v=2.1.0"></script>
<script src="js/theme.js?v=2.1.0"></script>
<script src="js/db.js?v=2.1.0"></script>
<script src="js/auth.js?v=2.1.0"></script>
<script src="js/reports.js?v=2.1.0"></script>
<script src="js/dashboard.js?v=2.1.0"></script>
</body>
</html>
